[project]
name = "agentic-rag"
version = "0.1.0"
requires-python = ">=3.11"
description = "Agentic RAG over a bot-protected 100K document corpus"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

# Per phase. Installed when that phase starts, not before, so a phase 0
# checkout does not pull torch or browser binaries.
[project.optional-dependencies]
fetch = ["curl_cffi>=0.7", "playwright>=1.47", "camoufox>=0.4", "protego>=0.3"]
extract = ["trafilatura>=1.12", "pymupdf4llm>=0.0.17", "docling>=2.0"]
index = ["qdrant-client>=1.11", "FlagEmbedding>=1.3"]
retrieve = ["sentence-transformers>=3.1"]
agent = ["langgraph>=0.2", "mcp>=1.0", "anthropic>=0.34"]

# Testing and development dependencies. These are not installed in production.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8",
]

# Used for Build Up of Project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# Tool used for code lint and formatting.
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "ANN",       # missing type annotations
    "B",         # bugbear
    "C90",       # mccabe complexity
    "PL",        # pylint
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",
    "T20",       # no print
    "BLE",       # no bare except
    "ASYNC",     # async correctness
]
ignore = ["PLR2004"]    # ANN101 and ANN102 were removed from ruff, not needed

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 25      # roughly 40 lines. Over this, split the function.
max-args = 5
max-branches = 8
max-returns = 4

# Ignore some rules for specific files. For example, tests often have long functions and many arguments, so we ignore those rules in tests.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004", "PLR0915"]
"notebooks/*" = ["T20", "ANN", "E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "notebooks.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires the local fixture server",
    "injection: prompt injection defence suite",
]
