[project]
name = "agentic-rag"
version = "0.1.0"
requires-python = ">=3.11"
description = "Agentic RAG over a bot-protected 100K document corpus"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.29",
]

# Per phase. Installed when that phase starts, not before, so a phase 0
# checkout does not pull torch or browser binaries.
[project.optional-dependencies]
fetch = ["curl_cffi>=0.7", "playwright>=1.47", "camoufox>=0.4", "protego>=0.3"]
extract = ["trafilatura>=1.12", "pymupdf4llm>=0.0.17", "docling>=2.0"]
index = ["qdrant-client>=1.11", "FlagEmbedding>=1.3"]
retrieve = ["sentence-transformers>=3.1"]
agent = ["langgraph>=0.2", "mcp>=1.0", "anthropic>=0.34"]

# Testing and development dependencies. These are not installed in production.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "asyncpg-stubs>=0.29",
    "pre-commit>=3.8",
]

# Used for Build Up of Project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# Tool used for code lint and formatting.
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "ANN",       # missing type annotations
    "B",         # bugbear
    "C90",       # mccabe complexity
    "PL",        # pylint
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",
    "T20",       # no print
    "BLE",       # no bare except
    "ASYNC",     # async correctness
]
ignore = [
    "PLR2004",   # ANN101 and ANN102 were removed from ruff, not needed
    # The Fetcher protocol in src/rag/fetch/SPEC.md takes a timeout by
    # contract. It is handed to the transport, not implemented by hand, which
    # is the case this rule exists to catch.
    "ASYNC109",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 25      # roughly 40 lines. Over this, split the function.
max-args = 5
max-branches = 8
max-returns = 4

# Ignore some rules for specific files. For example, tests often have long functions and many arguments, so we ignore those rules in tests.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004", "PLR0915", "PLC0415"]
"notebooks/*" = ["T20", "ANN", "E402"]
# Playwright and Camoufox ship no type information, and importing either at
# module scope costs hundreds of milliseconds in processes that never render.
"src/rag/fetch/browser.py" = ["ANN401", "PLC0415"]
# curl_cffi responses are untyped, and asyncpg scalars depend on the query.
"src/rag/fetch/static.py" = ["ANN401"]
"src/rag/db/pool.py" = ["ANN401"]
# trafilatura, PyMuPDF, docling, FlagEmbedding and qdrant-client are all heavy
# imports with no type information. Each is confined to one module, imported
# lazily so a process that never parses a PDF never loads PyMuPDF.
"src/rag/extract/html.py" = ["PLC0415"]
"src/rag/extract/office.py" = ["PLC0415"]
"src/rag/extract/service.py" = ["PLC0415"]
"src/rag/extract/pdf.py" = ["ANN401", "PLC0415"]
"src/rag/index/embed.py" = ["ANN401", "PLC0415"]
"src/rag/index/store.py" = ["ANN401", "PLC0415"]
"src/rag/retrieve/service.py" = ["ANN401", "PLC0415"]
"src/rag/retrieve/rerank.py" = ["ANN401", "PLC0415"]
# The MCP SDK is imported lazily so the package can be used without it, and
# its session and result types are dynamic.
"src/rag/mcp/client.py" = ["ANN401", "PLC0415"]
"src/rag/mcp/server.py" = ["ANN201", "PLC0415"]
# LangGraph and the Anthropic SDK are imported lazily and are dynamically typed.
"src/rag/agent/graph.py" = ["ANN401", "PLC0415"]
"src/rag/agent/llm.py" = ["ANN401", "PLC0415"]
"src/rag/agent/nodes.py" = ["ANN401"]
# FastAPI endpoint closures, a lazy uvicorn import, and cache values that are
# genuinely any JSON shape.
"src/rag/api/deps.py" = ["ANN401"]
"src/rag/api/main.py" = ["ANN401", "PLC0415"]
"src/rag/api/ask.py" = ["ANN401", "PLC0415"]

[tool.mypy]
# 3.12 because numpy's bundled stubs use `type` statements that mypy rejects
# under 3.11. The package itself stays 3.11 compatible.
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "notebooks.*"]
disallow_untyped_defs = false

# Third party libraries that ship no type information. Their call sites are
# wrapped in one module each, so the untyped surface stays contained.
[[tool.mypy.overrides]]
module = ["pymupdf4llm.*", "FlagEmbedding.*", "camoufox.*", "trafilatura.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rag.extract.pdf", "rag.index.embed"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires the local fixture server",
    "injection: prompt injection defence suite",
    "slow: launches a real browser or loads a model",
]
