# Only needed when the API and an ingest run must hold Qdrant at the same time.
# The default config uses Qdrant in process, which needs no container.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
