# Source registry seed. Loaded by: python -m rag.fetch.bootstrap
# One entry per source, not per URL. Adding a domain here is a deliberate
# legal decision, see src/rag/fetch/SPEC.md.
#
# Deliberately spread across scraping difficulty, so the fetch ladder is
# exercised rather than assumed:
#
#   books.toscrape.com   static HTML, product tables      tier 1
#   quotes.toscrape.com  static HTML, short prose         tier 1
#   quotes.toscrape.com/js  the same site rendered client side, which is what
#                           escalates it to tier 2
#   arxiv.org            real PDFs, multi column, tables  tier 1, slow

- source_id: books-toscrape
  domain: books.toscrape.com
  seed_urls:
    - "https://books.toscrape.com/"
    - "https://books.toscrape.com/catalogue/category/books_1/index.html"
  max_tier: 2
  allow_unlocker: false
  requests_per_second: 5
  priority: 2
  tos_note: "Sandbox site published for scraping practice. No restrictions."

- source_id: quotes-toscrape
  domain: quotes.toscrape.com
  seed_urls:
    - "https://quotes.toscrape.com/"
    - "https://quotes.toscrape.com/page/2/"
    - "https://quotes.toscrape.com/js/"
  max_tier: 3
  allow_unlocker: false
  requests_per_second: 5
  priority: 2
  tos_note: "Sandbox site published for scraping practice. The /js path renders client side, which is what escalates it to tier 2."

# PDFs, which is what exercises the extract ladder: text layer probe, layout
# probe, page range splitting and the table merge fixup. A PDF yields no links,
# so this source grows only by adding seeds here.
- source_id: arxiv-pdf
  domain: arxiv.org
  seed_urls:
    - "https://arxiv.org/pdf/2509.05378v3"
    - "https://arxiv.org/pdf/1706.03762"
    - "https://arxiv.org/pdf/2005.11401"
    - "https://arxiv.org/pdf/2004.04906"
    - "https://arxiv.org/pdf/1810.04805"
    - "https://arxiv.org/pdf/2307.09288"
  max_tier: 1
  allow_unlocker: false
  requests_per_second: 0.5
  priority: 1
  tos_note: "Open access papers. arXiv asks bulk users to use its S3 access, so this stays a handful of seeds at a low rate rather than a crawl."

# The only source with tier 4 enabled. Cloudflare refused all three self driven
# tiers here, 403 with cf-mitigated: challenge, which is what makes it the one
# useful demonstration of the paid tier. Enabling it is a deliberate decision
# per source, not a global default: see the legal boundaries section of
# src/rag/fetch/SPEC.md. Every tier 4 request is billable and logged.
- source_id: file-examples-pdf
  domain: file-examples.com
  seed_urls:
    # The old seed under /storage/ returns 404. Tier 4 is what revealed that:
    # the 403 the self driven tiers saw was the challenge, not the real answer.
    - "https://file-examples.com/wp-content/storage/2017/10/file-sample_150kB.pdf"
    - "https://file-examples.com/wp-content/storage/2017/10/file-example_PDF_500_kB.pdf"
  max_tier: 4
  allow_unlocker: true
  requests_per_second: 0.5
  priority: 1
  tos_note: "Sample file host, no terms forbidding automated access. Tier 4 enabled deliberately to exercise the unlocker path."



