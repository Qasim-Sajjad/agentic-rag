# Copy to config/settings.yaml. Env vars override with RAG__ prefix.
# Nested keys use a double underscore: RAG__FETCH__MIN_TEXT_CHARS=400.
# Anything a reviewer might change without editing code belongs here.
# When config/settings.yaml is absent this file is loaded instead, so a clean
# clone and CI both run without a copy step.

logging:
  level: info
  format: json          # json for machines, console for a local terminal

postgres:
  # Password belongs in .env as RAG__POSTGRES__DSN, never in a committed file.
  dsn: "postgresql://rag@127.0.0.1:5432/agentic_rag"
  pool_min_size: 1
  pool_max_size: 10
  command_timeout_seconds: 30.0

fetch:
  min_text_chars: 200
  max_attempts_per_tier: 3
  backoff_base_seconds: 2
  backoff_cap_seconds: 60
  max_retry_after_seconds: 300
  circuit_failure_threshold: 5
  circuit_open_minutes: 30
  circuit_open_cap_hours: 6
  circuit_reopen_limit: 3
  policy_cache_ttl_hours: 168
  browser_pool_size: 4
  default_requests_per_second: 1.0
  robots_cache_ttl_hours: 24
  lease_minutes: 10
  give_up_passes: 2
  give_up_pass_gap_hours: 1

  # Honest user agent with a contact URL, see the legal boundaries section of
  # src/rag/fetch/SPEC.md.
  user_agent: "agentic-rag/0.1 (+https://example.invalid/crawler)"
  impersonate_profile: chrome124
  browser_headless: true

  timeouts:
    static: 15.0
    browser: 30.0
    stealth: 45.0
    unlocker: 60.0

  # Body markers that mean a challenge page, not content. Extend per source.
  challenge_markers:
    - "just a moment"
    - "cf_chl_opt"
    - "checking your browser"
    - "datadome"
    - "_abck"
    - "please enable javascript and cookies"

extract:
  min_chars_per_page: 100
  max_garbage_ratio: 0.2
  pages_per_task: 50

qdrant:
  # path runs Qdrant in process with no server and wins over url. It is the
  # zero infrastructure default, and it is single process: the API and an
  # ingest run cannot hold it at once. For both at the same time, start the
  # server with docker compose up -d qdrant and set path to null.
  url: "http://127.0.0.1:6333"
  path: data/qdrant
  collection: corpus
  timeout_seconds: 30.0

index:
  target_tokens: 512
  overlap_ratio: 0.1
  max_table_tokens: 2048
  simhash_hamming_threshold: 3
  embed_batch_size: 32
  embed_model: BAAI/bge-m3
  embed_dims: 1024
  tenant_id: default

retrieve:
  candidate_pool: 50
  rerank_pool: 25
  rrf_k: 60
  score_floor: 0.3
  low_floor: 0.15
  elbow_delta: 0.15
  k_min: 3
  k_max: 15

agent:
  max_iterations: 1
  recursion_limit: 10

mcp:
  port: 8765
  session_call_budget: 20

llm:
  # api_key comes from ANTHROPIC_API_KEY in .env, never from this file.
  router_model: claude-haiku-4-5-20251001
  responder_model: claude-sonnet-5
  judge_model: claude-opus-5
  max_tokens: 2048
  temperature: 0.0
  timeout_seconds: 60.0

api:
  # Map an API key to a tenant. Real keys belong in .env as
  # RAG__API__API_KEYS, not here.
  api_keys:
    dev-key: default
  # explain returns the assembled context and the strip log. Debug affordance,
  # off outside a demo, and gated on top of the API key.
  explain_enabled: false
  cache_ttl_seconds: 300
  embed_cache_ttl_seconds: 3600
